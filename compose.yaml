services:
  shop:
    build: .
    ports:
      - "${SHOP_PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    volumes:
      - tunnel-data:/tunnel:ro
    depends_on:
      tunnel-init:
        condition: service_completed_successfully
        required: false

  # Local-dev only — forwards Stripe events to the shop service.
  # Run with: `docker compose --profile dev up`
  # First time: read the printed `whsec_...` from this container's logs and
  # paste it into .env's STRIPE_WEBHOOK_SECRET, then restart the shop service.
  # The whsec is stable across restarts on the same machine + Stripe account.
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["dev"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    command:
      - listen
      - --forward-to
      - http://shop:3000/api/webhooks/stripe
    depends_on:
      - shop

  # Free quick-tunnel — gives us a public https://*.trycloudflare.com URL so
  # Stripe (and, if you point it there, a Gelato dashboard webhook) can reach the
  # local shop. `tunnel-init` extracts the URL from cloudflared's log and writes
  # it to a shared volume; the shop's entrypoint reads it as SHOP_PUBLIC_URL.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["dev"]
    command: tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:20241 --url http://shop:3000
    ports:
      - "127.0.0.1:20241:20241"

  # Polls cloudflared's metrics endpoint for the quick-tunnel hostname and
  # writes the full URL to /tunnel/url. The shop entrypoint reads that file.
  tunnel-init:
    image: alpine:3.21
    profiles: ["dev"]
    depends_on:
      - tunnel
    volumes:
      - tunnel-data:/tunnel
    command: >
      sh -c '
      apk add --no-cache curl >/dev/null 2>&1;
      i=0;
      while [ $$i -lt 60 ]; do
        HOST=$$(curl -sf http://tunnel:20241/quicktunnel | sed -nE "s/.*\"hostname\":\"([^\"]+)\".*/\\1/p");
        if [ -n "$$HOST" ]; then
          echo "https://$$HOST" > /tunnel/url;
          echo "tunnel ready at https://$$HOST";
          exit 0;
        fi;
        i=$$((i+1));
        sleep 1;
      done;
      echo "tunnel-init: timed out waiting for quick-tunnel URL" >&2;
      exit 1
      '

  # Gelato webhooks are configured in the Gelato dashboard (no registration API),
  # so there is no auto-init service. For local testing, point a dashboard
  # webhook at <tunnel-url>/api/webhooks/gelato or use the dashboard's "send test
  # notification" button.

volumes:
  tunnel-data:
